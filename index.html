<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파문(波紋)</title>
<script src="cache_data.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; background: #f4f5f7; color: #111827; }
  .topbar { height: 64px; background: #ffffff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 32px; gap: 12px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: #2563eb; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; }
  .title { font-size: 17px; font-weight: 800; }
  .subtitle { font-size: 13px; color: #9ca3af; margin-left: 4px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 24px; }
  #resultArea { display: flex; flex-direction: column; gap: 24px; }
  .query-box { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .query-label { font-size: 13px; font-weight: 700; color: #6b7280; }
  .query-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  select {
    width: 220px; height: 48px; border: 1.5px solid #d1d5db; border-radius: 10px;
    padding: 0 14px; font-size: 15px; font-weight: 600; color: #111827; background: #fff; font-family: inherit;
  }
  button {
    height: 48px; padding: 0 22px; border-radius: 10px; border: none;
    background: #2563eb; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .hint { margin-left: auto; font-size: 12px; color: #9ca3af; }
  .result-title { display: flex; align-items: baseline; gap: 10px; }
  .result-title .big { font-size: 22px; font-weight: 800; }
  .result-title .small { font-size: 13px; color: #9ca3af; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 800; }
  .view { display: flex; gap: 10px; padding: 12px; border-radius: 10px; }
  .view.긍정 { background: #f0fdf4; }
  .view.부정 { background: #fef2f2; }
  .view.중립 { background: #f9fafb; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 100px; white-space: nowrap; height: fit-content; }
  .tag.긍정 { background: #dcfce7; color: #16a34a; }
  .tag.부정 { background: #fee2e2; color: #dc2626; }
  .tag.중립 { background: #e5e7eb; color: #4b5563; }
  .view-text { font-size: 13px; line-height: 1.6; color: #374151; }
  .cases { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 20px 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .cases-label { font-size: 13px; font-weight: 800; color: #6b7280; flex-shrink: 0; padding-top: 6px; }
  .case-item { background: #f9fafb; border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #374151; max-width: 320px; }
  .empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 60px 0; }
  .empty b { color: #6b7280; }
  .glossary-toggle {
    background: none; border: none; height: auto; padding: 0; font-weight: 600; font-size: 12px;
    color: #2563eb; cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  .glossary-box { display: none; border-top: 1px solid #eef0f2; padding-top: 14px; }
  .glossary-box.open { display: block; }
  .glossary-table { width: 100%; border-collapse: collapse; }
  .glossary-table th { text-align: left; font-size: 11px; color: #9ca3af; font-weight: 700; padding: 4px 10px; }
  .glossary-table td { font-size: 12px; color: #374151; padding: 8px 10px; border-top: 1px solid #f1f2f4; vertical-align: top; }
  .glossary-table td.term { font-weight: 700; color: #111827; white-space: nowrap; }
  .glossary-table td.meaning { color: #6b7280; white-space: nowrap; }
  .glossary-note { font-size: 11px; color: #9ca3af; margin-top: 10px; }
  .glossary-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* 모바일 화면 (너비 640px 이하) */
  @media (max-width: 640px) {
    .topbar { height: auto; padding: 14px 16px; flex-wrap: wrap; row-gap: 4px; }
    .subtitle { margin-left: 0; flex-basis: 100%; padding-left: 40px; }
    .wrap { padding: 16px 12px; gap: 16px; }
    .query-box { padding: 16px 16px; }
    .query-row { flex-direction: column; align-items: stretch; gap: 10px; }
    select, .query-row > button#queryBtn { width: 100%; }
    .glossary-toggle { width: 100%; text-align: left; }
    .hint { margin-left: 0; }
    .result-title { flex-wrap: wrap; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .card { padding: 16px 16px; }
    .cases { flex-direction: column; align-items: stretch; }
    .glossary-table th, .glossary-table td,
    .glossary-table td.term, .glossary-table td.meaning { white-space: normal; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">파</div>
  <div class="title">파문(波紋)</div>
  <div class="subtitle">같은 뉴스, 다른 해석</div>
</div>

<div class="wrap">

  <div class="query-box">
    <div class="query-label">이벤트 선택</div>
    <div class="query-row">
      <select id="category">
        <option value="금리">금리</option>
        <option value="물가">물가</option>
        <option value="고용">고용</option>
        <option value="경기">경기</option>
        <option value="유가">유가</option>
        <option value="무역·관세">무역·관세</option>
        <option value="지정학 리스크">지정학 리스크</option>
        <option value="금융 불안">금융 불안</option>
        <option value="통화정책">통화정책</option>
      </select>
      <select id="direction"></select>
      <button id="queryBtn">조회하기</button>
      <button type="button" class="glossary-toggle" id="glossaryToggle">용어 설명 보기</button>
      <div class="hint" id="hint">저장된 내용을 바로 보여줍니다 (없으면 안내 메시지 표시)</div>
    </div>
    <div class="glossary-box" id="glossaryBox"></div>
  </div>

  <div id="resultArea"></div>

</div>

<script>
const MARKETS = ["주식시장", "채권시장", "환율시장", "원자재시장", "부동산시장", "암호화폐시장", "위험지표"];
const PERSPECTIVES = ["긍정", "부정", "중립"];

// 카테고리별로 고를 수 있는 방향이 다름 (이벤트-시장 매트릭스 기준)
const CATEGORY_DIRECTIONS = {
  "금리": ["인상", "동결", "인하"],
  "물가": ["예상 상회", "예상 부합", "예상 하회"],
  "고용": ["예상 상회", "예상 부합", "예상 하회"],
  "경기": ["예상 상회", "예상 부합", "예상 하회"],
  "유가": ["급등", "급락"],
  "무역·관세": ["부과·확대", "완화·철회"],
  "지정학 리스크": ["확대", "완화"],
  "금융 불안": ["발생", "진정"],
  "통화정책": ["양적완화", "양적긴축"],
};

// 카테고리별 용어 설명 (CPI, PPI 등 헷갈리는 지표 뜻풀이)
// whenHigher / file 이 있는 항목은 "숫자가 예상보다 높을 때 어느 파일로 봐야 하는지" 매핑
// (실업률, 신규 실업수당 청구건수처럼 숫자와 고용 강도가 반대로 움직이는 지표는 inverted: true)
const GLOSSARY = {
  "물가": [
    { term: "CPI", meaning: "소비자물가지수", desc: "소비자가 사는 상품·서비스 가격. 가장 많이 보도되는 물가 지표", whenHigher: "물가가 예상보다 높음", file: "물가_예상상회" },
    { term: "근원 CPI (Core CPI)", meaning: "근원 소비자물가", desc: "CPI에서 변동이 큰 에너지·식품을 뺀 것. 추세를 보는 데 쓰임", whenHigher: "추세적인 물가 압력이 예상보다 강함", file: "물가_예상상회" },
    { term: "PCE", meaning: "개인소비지출 물가", desc: "미국 연준이 가장 중시하는 물가 지표", whenHigher: "연준이 중시하는 물가가 예상보다 높음", file: "물가_예상상회" },
    { term: "PPI", meaning: "생산자물가지수", desc: "기업이 사고파는 단계의 가격. CPI보다 먼저 움직이는 경향이 있어 선행 신호로 보기도 함", whenHigher: "생산 단계 가격이 높아 소비자물가 상승 압력이 커질 수 있음", file: "물가_예상상회" },
    { term: "기대인플레이션", meaning: "앞으로의 물가 전망", desc: "소비자·시장이 예상하는 미래 물가", whenHigher: "앞으로 물가가 오를 것이라는 인식이 강해짐", file: "물가_예상상회" },
  ],
  "고용": [
    { term: "비농업고용 (NFP)", meaning: "농업 외 일자리 증가 수", desc: "미국 고용의 핵심 지표. 보통 매월 첫째 주 금요일 발표", whenHigher: "일자리가 예상보다 많이 늘어 고용이 강함", file: "고용_예상상회" },
    { term: "실업률", meaning: "실업자 비율", desc: "NFP와 같은 날 함께 발표", whenHigher: "실업자가 많아 고용이 약함", file: "고용_예상하회", inverted: true },
    { term: "평균 시간당 임금", meaning: "임금 상승률", desc: "물가와 연결되어 금리 전망에 중요", whenHigher: "임금이 빠르게 올라 물가 압력이 커질 수 있음", file: "고용_예상상회" },
    { term: "신규 실업수당 청구건수", meaning: "새로 실업급여를 신청한 사람 수", desc: "매주 발표되어 고용 변화를 빨리 보여줌", whenHigher: "실직자가 늘어 고용이 약함", file: "고용_예상하회", inverted: true },
    { term: "JOLTS", meaning: "구인·이직 보고서", desc: "기업의 구인 수요를 보여줌", whenHigher: "기업의 구인 수요가 강함", file: "고용_예상상회" },
  ],
  "경기": [
    { term: "GDP", meaning: "국내총생산", desc: "경제 전체 규모와 성장률. 분기마다 발표되고 과거를 보여주는 후행적 성격", whenHigher: "경제 성장이 예상보다 강함", file: "경기_예상상회" },
    { term: "PMI / ISM", meaning: "구매관리자지수", desc: "기업 담당자 설문. 50보다 높으면 확장, 낮으면 위축. 대표적 선행 지표", whenHigher: "기업 경기가 예상보다 좋음", file: "경기_예상상회" },
    { term: "소매판매", meaning: "소매 매출", desc: "소비 흐름을 보여줌", whenHigher: "소비가 예상보다 강함", file: "경기_예상상회" },
    { term: "산업생산", meaning: "공장·광업 생산량", desc: "제조업 경기를 보여줌", whenHigher: "제조업 생산이 예상보다 강함", file: "경기_예상상회" },
    { term: "수출입 통계", meaning: "수출·수입 금액", desc: "한국처럼 수출 비중이 큰 나라에서 특히 중요", whenHigher: "수출 경기가 예상보다 좋음", file: "경기_예상상회" },
  ],
  "금리": [
    { term: "FOMC", meaning: "미국 연준의 금리 결정 회의", desc: "" },
    { term: "금통위", meaning: "한국은행 금융통화위원회의 금리 결정 회의", desc: "" },
    { term: "점도표", meaning: "FOMC 위원들의 향후 금리 전망을 점으로 표시한 것", desc: "" },
  ],
  "유가": [
    { term: "WTI", meaning: "미국 서부텍사스산 원유 가격", desc: "미국 원유 가격의 기준. 뉴스에서 \"유가\"라고 하면 보통 이 가격을 가리키는 경우가 많음", whenHigher: "" },
    { term: "브렌트유", meaning: "북해산 원유 가격", desc: "국제 유가의 기준으로 가장 널리 쓰임", whenHigher: "" },
    { term: "두바이유", meaning: "중동산 원유", desc: "한국이 주로 수입하는 원유의 기준 가격", whenHigher: "" },
    { term: "OPEC+ 회의", meaning: "산유국들이 생산량을 결정하는 회의", desc: "사우디아라비아, 러시아 등 주요 산유국이 참여하며, 감산·증산 결정이 유가에 직접 영향", whenHigher: "예상보다 감산 폭이 크면 유가 상승 압력, 증산 폭이 크면 하락 압력" },
    { term: "EIA 재고 발표", meaning: "미국 에너지정보청의 주간 원유 재고 통계", desc: "매주 수요일 발표. 시장 영향력이 가장 큰 원유 재고 지표", whenHigher: "예상보다 재고가 크게 줄면(Draw) 수요 강세로 해석되어 유가 <b>상승</b> 압력", inverted: true },
    { term: "API 재고 발표", meaning: "미국석유협회의 주간 원유 재고 추정치", desc: "매주 화요일, EIA보다 하루 먼저 발표되는 민간 기관 예비 수치. EIA 발표의 방향을 미리 가늠하는 용도로 많이 참고됨", whenHigher: "예상보다 재고가 크게 줄면(Draw) 유가 <b>상승</b> 압력", inverted: true },
    { term: "재고 증가 (Build)", meaning: "원유 재고가 전주보다 늘어난 것", desc: "수요보다 공급이 많다는 신호로 해석되는 경우가 많음", whenHigher: "" },
    { term: "재고 감소 (Draw)", meaning: "원유 재고가 전주보다 줄어든 것", desc: "수요가 공급보다 많다는 신호로 해석되는 경우가 많음", whenHigher: "" },
    { term: "전략비축유 (SPR)", meaning: "정부가 비상시를 대비해 비축한 원유", desc: "방출하면 시중 공급이 늘어 가격에 하방 압력. 러시아-우크라이나 전쟁 이후 미국이 여러 차례 방출한 바 있음", whenHigher: "예상보다 방출 규모가 크면 유가 하락 압력" },
  ],
  "무역·관세": [
    { term: "관세", meaning: "수입품에 매기는 세금", desc: "특정 국가나 품목을 정해 부과하며, 발표 시점과 실제 시행 시점이 다를 수 있음", whenHigher: "" },
    { term: "상호관세", meaning: "상대국 관세만큼 맞춰 매기는 방식", desc: "2025년 미국이 이 방식을 여러 국가에 동시 적용하며 널리 알려짐", whenHigher: "예상보다 세율이 높거나 대상 품목·국가가 넓음" },
    { term: "보복관세", meaning: "관세 인상에 맞대응하는 관세", desc: "한 나라가 관세를 올리면 상대국도 자국 수입품에 관세를 매겨 맞서는 것", whenHigher: "예상보다 세율이 높거나 대상 품목이 넓음" },
    { term: "관세 유예", meaning: "발표는 했지만 적용을 미루는 것", desc: "협상 여지를 남기기 위한 조치로, 유예 기간이 끝나면 다시 불확실성이 커질 수 있음", whenHigher: "예상보다 유예 기간이 길거나 대상이 넓음" },
    { term: "무역합의", meaning: "양국이 관세·교역 조건에 합의하는 것", desc: "단계별로 이뤄지기도 하며(1단계 합의 등), 기존 관세가 일부만 조정되는 경우도 많음", whenHigher: "예상보다 관세 인하 폭이 크거나 합의 범위가 넓음" },
    { term: "관세 면제", meaning: "특정 품목·국가를 관세에서 제외", desc: "국내 대체 생산이 어려운 품목이나 우호국에 주로 적용됨", whenHigher: "예상보다 면제 품목·국가가 많음" },
    { term: "공급망 재편", meaning: "생산 기지를 자국·우호국으로 옮기는 흐름", desc: "관세를 피하려는 목적 외에 안보·공급 안정성 확보 목적도 함께 거론됨", whenHigher: "" },
  ],
  "지정학 리스크": [
    { term: "지정학적 긴장", meaning: "국가 간 군사·외교적 갈등 고조", desc: "실제 무력 충돌 전 단계를 포함하며, 뉴스에서 가장 자주 쓰이는 포괄적 표현", whenHigher: "예상보다 충돌 수위가 높거나 확산 범위가 넓음" },
    { term: "제재", meaning: "특정국과의 거래·금융 접근 차단", desc: "무역 제한, 자산 동결, 국제 결제망(SWIFT) 차단 등 여러 형태가 있음", whenHigher: "예상보다 제재 대상·범위가 넓거나 강도가 높음" },
    { term: "안전자산 선호", meaning: "위기 시 금·달러·미 국채로 자금 쏠림", desc: "영어로는 'flight to safety'. 위험자산에서 자금이 빠져나가는 것과 동전의 양면", whenHigher: "" },
    { term: "리스크 프리미엄", meaning: "불확실성으로 자산 가격에 붙는 할인·할증", desc: "같은 자산이라도 분쟁 지역과 가까우면 리스크 프리미엄이 더 크게 붙음", whenHigher: "" },
    { term: "휴전/종전", meaning: "분쟁이 멈추거나 끝나는 것", desc: "휴전은 잠정 중단, 종전은 공식적 분쟁 종료로 시장이 받아들이는 신뢰도가 다름", whenHigher: "예상보다 합의 범위가 넓거나 지속 가능성이 높음" },
    { term: "대리전/프록시 갈등", meaning: "강대국이 다른 나라를 통해 간접 대립하는 것", desc: "직접 충돌보다 파급 범위를 가늠하기 어려워 시장이 불확실성을 더 크게 느끼는 경우가 많음", whenHigher: "" },
  ],
  "금융 불안": [
    { term: "뱅크런", meaning: "예금자들이 한꺼번에 예금을 인출하려는 사태", desc: "은행은 예금 대부분을 대출·투자로 운용하기 때문에, 동시 인출 요구를 감당하지 못하면 파산으로 이어짐", whenHigher: "예상보다 인출 규모가 크거나 여러 기관으로 번짐" },
    { term: "신용경색", meaning: "금융기관이 대출을 크게 줄이는 상황", desc: "은행이 위험을 꺼리게 되면서 건전한 기업도 자금 조달에 어려움을 겪는 경우가 생김", whenHigher: "예상보다 대출 축소 폭이 크거나 광범위함" },
    { term: "시스템 리스크", meaning: "한 기관 문제가 시스템 전체로 번질 위험", desc: "개별 기관 부실인지, 여러 기관이 서로 얽혀 전체가 흔들릴 위험인지를 구분하는 핵심 개념", whenHigher: "" },
    { term: "신용스프레드", meaning: "회사채·국채 금리 차이", desc: "스프레드가 커질수록 시장이 그 회사채의 부도 위험을 더 크게 본다는 뜻", whenHigher: "" },
    { term: "구제금융", meaning: "정부·중앙은행의 부실 기관 자금 지원", desc: "공적 자금 투입, 대출 보증, 자산 인수 등 다양한 방식이 있음", whenHigher: "예상보다 지원 규모가 크거나 대상이 넓음" },
    { term: "스트레스 테스트", meaning: "위기 상황 가정 하의 은행 건전성 점검", desc: "정기적으로 시행되며, 결과 발표 시 시장이 은행별 취약도를 다시 평가하는 계기가 됨", whenHigher: "예상보다 통과율이 낮거나 취약 기관이 많이 드러남" },
    { term: "대마불사", meaning: "너무 커서 망하면 시스템이 흔들리는 기관", desc: "2008년 금융위기 이후 이런 기관에 대한 규제 강화 논의가 활발해짐", whenHigher: "" },
  ],
  "통화정책": [
    { term: "양적완화(QE)", meaning: "중앙은행이 국채 등을 사들여 돈을 푸는 것", desc: "기준금리가 이미 매우 낮아 추가로 내리기 어려울 때 쓰는 비전통적 수단", whenHigher: "예상보다 매입 규모가 크거나 기간이 김" },
    { term: "양적긴축(QT)", meaning: "중앙은행이 보유 채권을 줄여 돈을 거둠", desc: "채권을 직접 팔거나, 만기가 돌아온 채권을 재투자하지 않는 방식으로 진행됨", whenHigher: "예상보다 축소 규모가 크거나 속도가 빠름" },
    { term: "테이퍼링", meaning: "양적완화 규모를 점점 줄이는 것", desc: "갑자기 멈추지 않고 단계적으로 줄여 시장 충격을 완화하려는 목적", whenHigher: "예상보다 축소 속도가 빠름" },
    { term: "중앙은행 대차대조표", meaning: "중앙은행이 보유한 자산 규모", desc: "QE는 이 규모를 늘리고, QT는 줄이는 과정으로 이해하면 됨", whenHigher: "" },
    { term: "포워드 가이던스", meaning: "중앙은행이 향후 정책 방향을 미리 알리는 것", desc: "시장이 미리 대비하게 해 급격한 충격을 줄이려는 커뮤니케이션 수단", whenHigher: "" },
  ],
};

const categorySel = document.getElementById("category");
const directionSel = document.getElementById("direction");
const queryBtn = document.getElementById("queryBtn");
const resultArea = document.getElementById("resultArea");
const glossaryToggle = document.getElementById("glossaryToggle");
const glossaryBox = document.getElementById("glossaryBox");

// 캐시 파일 이름 규칙: {카테고리}_{방향}.json (둘 다 띄어쓰기·가운뎃점(·) 제거)
// JSON 내부 event 값은 띄어쓰기/가운뎃점을 그대로 유지 (예: "무역·관세", "부과·확대")
function directionKey(str) {
  return str.replace(/[\s·]/g, "");
}

// 용어표의 "예상보다 ~할 때" 열 제목: 수치로 발표되는 카테고리는 "높을 때", 사건성 카테고리는 "강할 때"
const WHEN_HIGHER_LABEL = {
  "물가": "예상보다 높을 때",
  "고용": "예상보다 높을 때",
  "경기": "예상보다 높을 때",
  "무역·관세": "예상보다 강할 때",
  "지정학 리스크": "예상보다 강할 때",
  "금융 불안": "예상보다 강할 때",
  "통화정책": "예상보다 강할 때",
};

function fillDirectionOptions() {
  const directions = CATEGORY_DIRECTIONS[categorySel.value] || [];
  directionSel.innerHTML = directions.map((d) => `<option value="${d}">${d}</option>`).join("");
}

function renderEmpty(category, direction) {
  const fileName = `${directionKey(category)}_${directionKey(direction)}.json`;
  resultArea.innerHTML = `
    <div class="card" style="grid-column: 1 / -1;">
      <div class="empty">
        <b>"${category} - ${direction}"</b> 조합은 아직 만들어진 내용이 없어요.<br><br>
        클로드채팅_질문양식.txt 를 열어서 카테고리/방향을 바꿔 클로드 채팅에 물어보고,<br>
        받은 답변을 <code>cache/${fileName}</code> 이름으로 저장한 뒤,<br>
        <code>데이터_합치기.py</code>를 다시 실행해주세요.
      </div>
    </div>`;
}

function renderResult(data) {
  const ev = data.event;
  let html = `
    <div class="result-title">
      <div class="big">${ev.category} ${ev.direction}</div>
      <div class="small">이 조합에 대한 시장별 관점 정리</div>
    </div>
    <div class="grid">`;

  for (const market of MARKETS) {
    const views = data.markets[market];
    if (!views) continue;
    html += `<div class="card"><h3>${market}</h3>`;
    for (const stance of PERSPECTIVES) {
      const v = views[stance];
      if (!v) continue;
      html += `
        <div class="view ${stance}">
          <span class="tag ${stance}">${stance}</span>
          <div class="view-text">${v.logic}</div>
        </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;

  if (data.past_cases && data.past_cases.length > 0) {
    html += `<div class="cases"><div class="cases-label">과거 유사 사례</div>`;
    for (const c of data.past_cases) {
      html += `<div class="case-item"><b>${c.date || ""}</b> ${c.name || ""} · ${c.summary || ""}</div>`;
    }
    html += `</div>`;
  }

  resultArea.innerHTML = html;
}

function queryEvent() {
  const category = categorySel.value;
  const direction = directionSel.value;
  const key = `${directionKey(category)}_${directionKey(direction)}`;
  const data = (typeof EVENT_DATA !== "undefined") ? EVENT_DATA[key] : null;

  if (data) {
    renderResult(data);
  } else {
    renderEmpty(category, direction);
  }
}

function renderInitial() {
  resultArea.innerHTML = `
    <div class="card" style="grid-column: 1 / -1;">
      <div class="empty">이벤트를 선택하고 <b>"조회하기"</b> 버튼을 눌러주세요.</div>
    </div>`;
}

function renderGlossary() {
  const items = GLOSSARY[categorySel.value] || [];
  if (items.length === 0) {
    glossaryBox.innerHTML = `<div class="empty" style="padding: 20px 0;">이 카테고리에는 등록된 용어가 없어요.</div>`;
    return;
  }
  const hasMapping = items.some((item) => item.whenHigher);
  const hasInverted = items.some((item) => item.inverted);
  const whenLabel = WHEN_HIGHER_LABEL[categorySel.value] || "예상보다 강할 때";
  let html = `<div class="glossary-scroll"><table class="glossary-table"><thead><tr><th>용어</th><th>뜻</th><th>설명</th>`;
  if (hasMapping) html += `<th>${whenLabel}</th>`;
  html += `</tr></thead><tbody>`;
  for (const item of items) {
    html += `<tr><td class="term">${item.term}</td><td class="meaning">${item.meaning}</td><td>${item.desc}</td>`;
    if (hasMapping) {
      const warn = item.inverted ? `<span class="warn-badge" title="숫자와 방향이 반대인 지표예요">⚠️</span> ` : "";
      html += `<td>${warn}${item.whenHigher || ""}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  if (hasInverted) {
    html += `<div class="glossary-note">⚠️ 표시는 겉으로 보이는 숫자와 실제 방향이 반대이거나 헷갈리기 쉬운 지표예요. 위 "예상보다 ~할 때" 칸의 설명을 참고하세요.</div>`;
  }
  glossaryBox.innerHTML = html;
}

function updateGlossaryForCategory() {
  renderGlossary();
  if (glossaryBox.classList.contains("open")) {
    glossaryToggle.textContent = `${categorySel.value} 용어 설명 숨기기`;
  }
}

glossaryToggle.addEventListener("click", () => {
  const isOpen = glossaryBox.classList.toggle("open");
  if (isOpen) {
    renderGlossary();
    glossaryToggle.textContent = `${categorySel.value} 용어 설명 숨기기`;
  } else {
    glossaryToggle.textContent = "용어 설명 보기";
  }
});

categorySel.addEventListener("change", () => {
  fillDirectionOptions();
  updateGlossaryForCategory();
});
queryBtn.addEventListener("click", queryEvent);

// 처음 화면 진입 시에는 조회하지 않고, 안내 메시지만 표시
fillDirectionOptions();
renderInitial();
</script>

</body>
</html>
